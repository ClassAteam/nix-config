# Swap yazi's default z/Z: recently-visited dirs (zoxide) on the easier
# lowercase 'z', fzf file/dir jump moved to 'Z'.
[[mgr.prepend_keymap]]
on = "z"
run = "plugin zoxide"
desc = "Jump to a directory via zoxide"

[[mgr.prepend_keymap]]
on = "Z"
run = "plugin fzf"
desc = "Jump to a file/directory via fzf"
